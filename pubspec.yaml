name: green_pulse_delhi
description: A high-fidelity, frontend-only mobile application prototype for "Green-Pulse Delhi".
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^13.0.2
  geoflutterfire_plus: ^0.0.34

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0

  # Camera & Fonts
  camera: ^0.10.5+5
  google_fonts: ^6.1.0

  # Networking
  http: ^1.3.0

  # State Management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
